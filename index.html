<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yourdemowebsite</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7fbfa;
      color: #18323d;
    }
    main {
      max-width: 36rem;
      padding: 2.5rem 1.5rem;
    }
    h1 {
      margin: 0 0 0.6rem;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: 2.4rem;
      letter-spacing: -0.04em;
      color: #0b2433;
    }
    p { margin: 0 0 1.4rem; line-height: 1.6; color: #60777d; }
    a {
      display: inline-block;
      padding: 0.75rem 1.1rem;
      border-radius: 999px;
      background: #0f7180;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #123b4c; }
  </style>
</head>
<body>
  <main>
    <h1>Demo sites</h1>
    <p>Static previews hosted with GitHub Pages.</p>
    <a href="tomimatsu/">Tomimatsu Kazuo DDS</a>
  </main>
</body>
</html>
